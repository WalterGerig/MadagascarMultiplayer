[Keybinds]
ToggleMouseMode=113         ; F2 (VK_F2 = 113) -> Toggle mouse lock / UI mode
ToggleOverlayVisibility=114 ; F3 (VK_F3 = 114) -> Toggle ImGui overlay visibility
ToggleWidescreen=57        ; Key 9 (ASCII '9' = 57) -> 16:9 Borderless Widescreen

[Network]
DefaultIP=127.0.0.1
DefaultPort=27015

[Display]
AutoEnableWidescreen=0     ; 1 = Enable borderless widescreen automatically on startup

[Debug]
EnableFileLogging=1        ; 1 = Synchronous file logging to multiplayer_debug.log

[Cheats]
KeyToggleFlight=78         ; N (VK_N = 78 / 0x4E) -> Toggle flight/noclip mode
DefaultFlightSpeed=1.0     ; Default flight movement speed multiplier
EnableGodModeDefault=0     ; 1 = God mode enabled by default on launch
EnableInfiniteJumpDefault=0 ; 1 = Infinite mid-air jump enabled by default
DefaultMoveSpeedMultiplier=1.0 ; Default player movement speed multiplier
